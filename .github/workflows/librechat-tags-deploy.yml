name: Tag Deploy Trigger

on:
  push:
    tags:
      - "librechat-dev*"
      - "librechat-prod*"

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Extract tag info
        id: extract-tag
        run: |
          TAG_NAME=$(echo ${{ github.ref }} | sed 's/refs\/tags\///')
          if [[ "$TAG_NAME" =~ ^librechat-(dev|prod)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "environment=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "version=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
          else
            echo "Error: Invalid tag format"
            exit 1
          fi

      - name: Trigger Libre Chat Deploy
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'librechat-deploy.yml',
              ref: 'main',
              inputs: {
                environment: '${{ steps.extract-tag.outputs.environment }}',
                version: '${{ steps.extract-tag.outputs.version }}'
              }
            }) 