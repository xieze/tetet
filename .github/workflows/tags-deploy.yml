name: Tag Deploy Trigger

on:
  push:
    tags:
      - "server-dev*"
      - "server-prod*"
      - "student_frontend-dev*"
      - "student_frontend-prod*"

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Extract tag info
        id: extract-tag
        run: |
          TAG_NAME=$(echo ${{ github.ref }} | sed 's/refs\/tags\///')
          if [[ "$TAG_NAME" =~ ^(server|student_frontend)-(dev|prod)-(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "project_name=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "environment=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
            echo "version=${BASH_REMATCH[3]}" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Libre Chat Deploy
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '${{ steps.extract-tag.outputs.project_name }}-deploy.yml',
              ref: '${{ steps.extract-tag.outputs.tag_name }}',
              inputs: {
                environment: '${{ steps.extract-tag.outputs.environment }}',
                version: '${{ steps.extract-tag.outputs.version }}'
              }
            })
